server:
  port: 8888
app:
  api-prefix: /api/v1
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: identity_service
            uri: http://localhost:8080
            predicates:
              - Path=${app.api-prefix}/identity/**
            filters:
              - StripPrefix=2
          - id: product-service
            uri: http://localhost:8081
            predicates:
              - Path=${app.api-prefix}/product/**
            filters:
              - StripPrefix=2
          - id: cart-service
            uri: http://localhost:8082
            predicates:
              - Path=${app.api-prefix}/cart/**
            filters:
              - StripPrefix=2
          - id: order-service
            uri: http://localhost:8083
            predicates:
              - Path=${app.api-prefix}/order/**
            filters:
              - StripPrefix=2
          - id: payment-service
            uri: http://localhost:8084
            predicates:
              - Path=${app.api-prefix}/payment/**
            filters:
              - StripPrefix=2
          - id: shipment-service
            uri: http://localhost:8085
            predicates:
              - Path=${app.api-prefix}/shipment/**
            filters:
              - StripPrefix=2
          - id: notification-service
            uri: http://localhost:8086
            predicates:
              - Path=${app.api-prefix}/notification/**
            filters:
              - StripPrefix=2
          - id: file-service
            uri: http://localhost:8087
            predicates:
              - Path=${app.api-prefix}/file/**
            filters:
              - StripPrefix=2
          - id: profile-service
            uri: http://localhost:8089
            predicates:
              - Path=${app.api-prefix}/profile/**
            filters:
              - StripPrefix=2
          - id: chat-service
            uri: http://localhost:8088
            predicates:
              - Path=${app.api-prefix}/chat/**
            filters:
              - StripPrefix=2
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Identity Service
        url: /api/v1/identity/v3/api-docs

      - name: Product Service
        url: /api/v1/product/v3/api-docs

      - name: Cart Service
        url: /api/v1/cart/v3/api-docs

      - name: Order Service
        url: /api/v1/order/v3/api-docs

      - name: Payment Service
        url: /api/v1/payment/v3/api-docs

      - name: Shipment Service
        url: /api/v1/shipment/v3/api-docs

      - name: Notification Service
        url: /api/v1/notification/v3/api-docs

      - name: File Service
        url: /api/v1/file/v3/api-docs

      - name: Profile Service
        url: /api/v1/profile/v3/api-docs

      - name: Chat Service
        url: /api/v1/chat/v3/api-docs

    urls-primary-name: Identity Service
logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG