server:
  port: 8888
app:
  api-prefix: /api/v1
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: identity_service
            uri: http://localhost:8080
            predicates:
              - Path=${app.api-prefix}/identity/**
            filters:
              - StripPrefix=2
          - id: product-service
            uri: http://localhost:8081
            predicates:
              - Path=${app.api-prefix}/product/**
            filters:
              - StripPrefix=2
          - id: cart-service
            uri: http://localhost:8082
            predicates:
              - Path=${app.api-prefix}/cart/**
            filters:
              - StripPrefix=2
          - id: order-service
            uri: http://localhost:8083
            predicates:
              - Path=${app.api-prefix}/order/**
            filters:
              - StripPrefix=2
          - id: payment-service
            uri: http://localhost:8084
            predicates:
              - Path=${app.api-prefix}/payment/**
            filters:
              - StripPrefix=2
          - id: shipment-service
            uri: http://localhost:8085
            predicates:
              - Path=${app.api-prefix}/shipment/**
            filters:
              - StripPrefix=2
          - id: notification-service
            uri: http://localhost:8086
            predicates:
              - Path=${app.api-prefix}/notification/**
            filters:
              - StripPrefix=2
          - id: file-service
            uri: http://localhost:8087
            predicates:
              - Path=${app.api-prefix}/file/**
            filters:
              - StripPrefix=2