spring:
  application:
    name: profile-service
  datasource:
    url: ${PROFILE_DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
server:
  port: 8089
  servlet:
    context-path: /profile
