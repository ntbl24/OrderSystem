spring:
  application:
    name: profile-service
  datasource:
    url: ${PROFILE_DB_URL:jdbc:postgresql://localhost:5432/profile}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8089
  servlet:
    context-path: /profile
app:
  services:
    file:
      url: http://localhost:8087/api/v1/file
