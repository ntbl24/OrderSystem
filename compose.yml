services:
  postgres:
    image: postgres:17.11-alpine3.24
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "3306:5432"
    volumes:
      - ecommerce:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d identity"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ecommerce:
    name: ecommerce
